<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>o2h service worker</title>
  <!-- #include virtual="/imports.html" -->
</head>
<body>
  <pre id="differences"></pre>
  <div id="test-complete" style="display:none;" data-status=""></div>
  <script type="module">
    import { whenO2HWorkerReady, storeO2HTransform, prepareO2HTransform, O2H_HEADER } from '../worker/client.js';
    import { assignFromAsync, ItemscopeRegistry } from 'assign-gingerly/index.js';

    const differences = [];
    const check = (condition, message) => { if (!condition) differences.push(message); };
    const complete = document.getElementById('test-complete');
    try {
      // The worker (o2h-sw.js, at o2h's root, so its scope covers this page) controls the page before any o2h fetch
      await whenO2HWorkerReady('../o2h-sw.js');
      check(navigator.serviceWorker.controller, 'the worker should control the page');

      // The page stores the transform its requests name: JSON-only config and options
      const config = {
        map: {
          name: ['h2', '?.'],
          rocket: ['section', { 'class :=': 'card' }, [['h3', '?.name'], ['p', '?.type']]],
          crew: ['ul', {}, { each: ['li', '?.name'], key: '?.id' }],
          note: ['p', '?.'],
        },
      };
      await storeO2HTransform('mission-card', { config, options: {} });
      await storeO2HTransform('broken', { config: { map: { name: { snippet: 'missing' } } } });

      // A marked fetch: HTML, with the JSON embedded after it
      const response = await fetch('data/mission.json', { headers: { [O2H_HEADER]: 'mission-card' } });
      check(response.headers.get('Content-Type') === 'text/html; charset=utf-8', `marked: Content-Type ${response.headers.get('Content-Type')}`);
      check((response.headers.get('Vary') ?? '').includes(O2H_HEADER), 'marked: Vary names the header');
      check(!response.headers.get('X-O2H-Error'), `marked: unexpected error ${response.headers.get('X-O2H-Error')}`);
      const html = await response.text();
      check(html.startsWith('<!--?start name="tree"--><h2>Demo Mission 7</h2><section class="card"><h3>Falcon 9</h3><p>rocket</p></section>'),
        `marked: rendered HTML (${html.slice(0, 120)})`);
      check(html.includes('<li>Avery</li><li>Rowan</li>'), 'marked: the repeat');
      check(html.includes('<p>Fuel &lt;/script&gt; &amp; &lt;b&gt;loading&lt;/b&gt;</p>'), 'marked: text escaped');
      check(html.includes('<!--?end--><script type="application/json" data-tree="tree">'), 'marked: the JSON embedded after the tree');

      // The page hydrates from it: builtIns.tree adopts every element, from the embedded data
      const host = document.createElement('div');
      host.innerHTML = html;
      document.body.append(host);
      const data = JSON.parse(host.querySelector('script[type="application/json"][data-tree="tree"]').textContent);
      check(data.note === 'Fuel <\/script> & <b>loading</b>', 'embedded: the data round-trips, <\/script> included');
      const before = [...host.querySelectorAll('*')];
      await assignFromAsync(host, { '?. =>': { do: 'builtIns.tree', adopt: true, ...config } }, { from: data });
      const after = [...host.querySelectorAll('*')];
      check(before.length === after.length && before.every((el, i) => el === after[i]), 'hydration: every element adopted');

      // Unmarked: untouched JSON
      const plain = await fetch('data/mission.json');
      check((plain.headers.get('Content-Type') ?? '').startsWith('application/json'), `unmarked: Content-Type ${plain.headers.get('Content-Type')}`);
      check((await plain.json()).name === 'Demo Mission 7', 'unmarked: the JSON');

      // No transform for the key: the original JSON, with X-O2H-Error
      const missing = await fetch('data/mission.json', { headers: { [O2H_HEADER]: 'no-such-key' } });
      check((missing.headers.get('X-O2H-Error') ?? '').includes('no transform for "no-such-key"'), `missing: X-O2H-Error ${missing.headers.get('X-O2H-Error')}`);
      check((await missing.json()).name === 'Demo Mission 7', 'missing: the original JSON');

      // Rendering fails (a snippet the options don't have): the original JSON, with X-O2H-Error
      const broken = await fetch('data/mission.json', { headers: { [O2H_HEADER]: 'broken' } });
      check((broken.headers.get('X-O2H-Error') ?? '').includes('rendering failed'), `broken: X-O2H-Error ${broken.headers.get('X-O2H-Error')}`);
      check((await broken.json()).name === 'Demo Mission 7', 'broken: the original JSON');

      // Code the worker can't have (pipes, a manager class): prepareO2HTransform stores stand-ins; the worker leaves what
      // needs them to the client (pending, and pending structure); adopt: 'pending' with the real code finishes it
      {
        class RocketManager {
          static is = 'rocket-manager';
          constructor(el, initVals) { Object.assign(this, initVals); }
          get label() { return `Rocket: ${this.name}`; }
        }
        const pipes = { upper: s => s.toUpperCase(), kind: crew => (crew.length > 1 ? 'many' : 'one'), active: crew => crew.filter(c => c.id) };
        const managers = { [RocketManager.is]: RocketManager };
        const full = {
          map: {
            name: ['h2', '?.upper'],
            'crew /* size */': { switch: '?.kind', cases: { many: ['p', 'Many'], one: ['p', 'One'] } },
            'crew /* list */': ['ul', {}, { each: ['li', '?.name'], of: '?.active', key: '?.id' }],
            rocket: [{ tag: 'section', ish: 'rocket-manager' }, {}, [['b', '?.label']]],
            note: ['p', '?.'],
          },
        };
        const { key, transform, lost } = await prepareO2HTransform(full, { pipes, managers });
        check(lost.length === 4, `lost: ${JSON.stringify(lost)}`);
        await storeO2HTransform(key, transform);
        const served = await (await fetch('data/mission.json', { headers: { [O2H_HEADER]: key } })).text();
        check(served.includes('<h2 data-pending></h2><!--?switch pending--><ul data-pending></ul>'), `lost code: left to the client (${served.slice(0, 160)})`);

        const host = document.createElement('div');
        host.innerHTML = served;
        document.body.append(host);
        const note = host.querySelector('p');
        const data = JSON.parse(host.querySelector('script[data-tree="tree"]').textContent);
        const registry = { itemscopeRegistry: new ItemscopeRegistry(managers) };
        await assignFromAsync(host, { '?. =>': { do: 'builtIns.tree', adopt: 'pending', ...full } }, { from: data, pipes, registry });
        check(host.querySelector('p:last-of-type') === note, 'lost code: the rest was adopted, not rebuilt');

        const reference = document.createElement('div');
        await assignFromAsync(reference, { '?. =>': { do: 'builtIns.tree', ...full } }, { from: data, pipes, registry: { itemscopeRegistry: new ItemscopeRegistry(managers) } });
        const strip = el => {
          const copy = el.cloneNode(true);
          copy.querySelector('script[type="application/json"]')?.remove();
          for (const s of copy.querySelectorAll('[itemscope]')) s.removeAttribute('itemscope');
          return copy.innerHTML.replace(/<!--[^>]*-->/g, '');
        };
        check(strip(host) === strip(reference), `lost code: after hydration, the same DOM as Tree's own\n  ${strip(host)}\n  ${strip(reference)}`);
        check(!host.querySelector('[data-pending]'), 'lost code: no marks left');
      }

      // Data pipes (assign-gingerly's dataPipes) survive the trip: the worker renders what uses them
      {
        const { dataPipes } = await import('assign-gingerly/pipes/dataPipes.js');
        const pipes = dataPipes({ shout: { use: 'upper' }, rocketKind: { map: { rocket: 'A rocket' }, default: '?' } });
        const withData = { map: { name: ['h2', '?.shout'], rocket: ['p', '?.type?.rocketKind'] } };
        const { key, transform, lost } = await prepareO2HTransform(withData, { pipes });
        check(lost.length === 0, `data pipes: nothing lost (${JSON.stringify(lost)})`);
        await storeO2HTransform(key, transform);
        const served = await (await fetch('data/mission.json', { headers: { [O2H_HEADER]: key } })).text();
        check(served.startsWith('<!--?start name="tree"--><h2>DEMO MISSION 7</h2><p>A rocket</p><!--?end-->'), `data pipes: rendered in the worker (${served.slice(0, 120)})`);
      }

      // Marked, but the response isn't JSON: untouched
      const page = await fetch('service-worker.html', { headers: { [O2H_HEADER]: 'mission-card' } });
      check((page.headers.get('Content-Type') ?? '').startsWith('text/html') && (await page.text()).includes('o2h service worker'), 'non-JSON: untouched');
    } catch (e) {
      differences.push(`error: ${e.message}`);
    }
    document.getElementById('differences').textContent = differences.join('\n');
    complete.dataset.status = differences.length === 0 ? 'success' : 'failure';
  </script>
</body>
</html>
