<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>o2h vs builtIns.tree</title>
  <!-- #include virtual="/imports.html" -->
</head>
<body>
  <pre id="differences"></pre>
  <div id="test-complete" style="display:none;" data-status=""></div>
  <script type="module">
    import { o2h } from '../o2h.js';
    import { assignFromAsync, ItemscopeRegistry } from 'assign-gingerly/index.js';
    import { config, pipes, managers, snippets, initialVm } from '../demo/treeDefinition.js';

    const differences = [];
    const complete = document.getElementById('test-complete');
    try {
      const vm = initialVm(await (await fetch('../demo/data/launch.json')).json());

      // o2h's HTML, parsed (not finished: hydration.html covers that)
      const { html } = o2h(config, vm, { pipes, managers, snippets });
      const server = document.createElement('div');
      server.innerHTML = html;
      if (!server.querySelector('[data-pending]')) differences.push('o2h marked no pending elements');

      // builtIns.tree, from the same definition
      const client = document.createElement('div');
      await assignFromAsync(client, { '?. =>': { do: 'builtIns.tree', ...config } }, {
        from: vm, pipes, snippets, registry: { itemscopeRegistry: new ItemscopeRegistry(managers) },
      });

      // Node by node; the intended differences are the data-pending marks and itemscope="<manager>", which o2h adds for the client
      const attrs = el => [...el.attributes]
        .filter(a => a.name !== 'data-pending' && !(a.name === 'itemscope' && a.value in managers))
        .map(a => `${a.name}=${a.value}`).sort().join(' ');
      const walk = (a, b, path) => {
        if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return differences.push(`${path}: ${a.nodeName} vs ${b.nodeName}`);
        if (a.nodeType !== 1) {
          if (a.data !== b.data) differences.push(`${path}: ${JSON.stringify(a.data)} vs ${JSON.stringify(b.data)}`);
          return;
        }
        if (attrs(a) !== attrs(b)) differences.push(`${path} <${a.localName}>: [${attrs(a)}] vs [${attrs(b)}]`);
        if (a.childNodes.length !== b.childNodes.length) return differences.push(`${path} <${a.localName}>: ${a.childNodes.length} vs ${b.childNodes.length} children`);
        a.childNodes.forEach((child, i) => walk(child, b.childNodes[i], `${path}/${i}`));
      };
      walk(server, client, '');
    } catch (e) {
      differences.push(`error: ${e.message}`);
    }
    document.getElementById('differences').textContent = differences.join('\n');
    complete.dataset.status = differences.length === 0 ? 'success' : 'failure';
  </script>
</body>
</html>
